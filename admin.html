<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Админка — Билет к маме Сифона</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:#68463d;background:#fff1e9;padding:30px 16px}.wrap{max-width:1000px;margin:auto}.card{background:#fffaf7;border-radius:22px;padding:22px;margin:18px 0;box-shadow:0 12px 35px #d99b8c33}.login{max-width:440px;margin:70px auto}h1{text-align:center}.sub{text-align:center;color:#9a7065}input{width:100%;padding:13px;border:2px solid #f0c4b7;border-radius:12px;margin:6px 0 10px;font-size:16px}button{border:0;border-radius:12px;padding:12px 17px;font-weight:700;cursor:pointer}.primary{background:#e47d7d;color:white;width:100%}.danger{background:#d95368;color:white}.muted{background:#f2ded7;color:#68463d}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.error{color:#b42318;margin-top:10px}.ok{color:#18794e;margin-top:10px}table{width:100%;border-collapse:collapse;margin-top:15px}th,td{text-align:left;padding:12px 9px;border-bottom:1px solid #efdcd5}.empty{text-align:center;color:#9a7065;padding:30px}</style></head><body><div class="wrap">
<h1>🎟️ Админ-панель</h1><p class="sub">Билет к маме Сифона</p>
<section id="loginCard" class="card login"><h2>Вход администратора</h2><p>Введите email и пароль администратора.</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Пароль"><button id="loginBtn" class="primary">Войти</button><div id="loginMsg" class="error"></div></section>
<section id="adminCard" style="display:none"><div class="card"><div class="row"><div><b>Всего билетов: <span id="count">0</span></b><div id="who" class="sub" style="text-align:left"></div></div><div class="row"><button id="refreshBtn" class="muted">🔄 Обновить</button><button id="clearBtn" class="danger">🗑️ Очистить очередь</button><button id="logoutBtn" class="muted">Выйти</button></div></div><div id="msg"></div></div>
<div class="card"><table><thead><tr><th>№</th><th>Имя</th><th>Время</th><th></th></tr></thead><tbody id="body"></tbody></table><div id="empty" class="empty" style="display:none">Очередь пуста.</div></div></section></div>
<script>
const SUPABASE_URL="https://amtfqxrqvtadjmqdfhrf.supabase.co";
const SUPABASE_KEY="sb_publishable_RicXtLtPzYwf3oSK_gnidw_Y10JbDwI";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=x=>document.getElementById(x);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
function msg(t,ok=false){$("msg").textContent=t;$("msg").className=ok?"ok":"error"}
async function load(){const {data,error}=await sb.from("tickets").select("id,name,ticket_number,created_at").order("ticket_number",{ascending:true});if(error){msg("Ошибка: "+error.message);return}$("count").textContent=data.length;$("body").innerHTML="";$("empty").style.display=data.length?"none":"block";data.forEach(t=>{const tr=document.createElement("tr");tr.innerHTML=`<td><b>№${t.ticket_number}</b></td><td>${esc(t.name)}</td><td>${new Date(t.created_at).toLocaleString("ru-RU")}</td><td><button class="danger">Удалить</button></td>`;tr.querySelector("button").onclick=()=>del(t.id,t.name);$("body").appendChild(tr)})}
async function del(id,name){if(!confirm("Удалить билет "+name+"?"))return;const {error}=await sb.rpc("delete_ticket",{ticket_id:id});if(error){msg("Не удалось удалить: "+error.message);return}msg("Билет удалён.",true);load()}
async function clearQ(){if(!confirm("Точно удалить ВСЕ билеты?"))return;const {error}=await sb.rpc("reset_queue");if(error){msg("Не удалось очистить: "+error.message);return}msg("Очередь очищена. Нумерация снова с №1.",true);load()}
async function check(){const {data:{session}}=await sb.auth.getSession();if(!session){$("loginCard").style.display="block";$("adminCard").style.display="none";return}const {data:admin,error}=await sb.from("admin_users").select("user_id").eq("user_id",session.user.id).maybeSingle();if(error||!admin){await sb.auth.signOut();$("loginCard").style.display="block";$("adminCard").style.display="none";$("loginMsg").textContent="Этот аккаунт не добавлен в список администраторов.";return}$("loginCard").style.display="none";$("adminCard").style.display="block";$("who").textContent=session.user.email||"";load()}
$("loginBtn").onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(error){$("loginMsg").textContent=error.message;return}check()};
$("refreshBtn").onclick=load;$("clearBtn").onclick=clearQ;$("logoutBtn").onclick=async()=>{await sb.auth.signOut();check()};sb.auth.onAuthStateChange(()=>setTimeout(check,0));check();
</script></body></html>
