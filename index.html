<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Билет к маме Сифона 💗</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Trebuchet MS",Arial,sans-serif;background:radial-gradient(circle at 10% 10%,#ffe1d5,transparent 28%),radial-gradient(circle at 90% 90%,#ffdce8,transparent 30%),linear-gradient(135deg,#fff6ec,#ffe8df,#ffeaf1);color:#68463d}.page{width:min(1000px,94%);margin:auto;padding:30px 0 50px}header{text-align:center;margin-bottom:25px}.logo{font-size:52px}h1{margin:5px 0;font-size:32px}.subtitle{color:#a47468}.status{display:inline-flex;align-items:center;gap:8px;margin-top:15px;padding:8px 15px;border-radius:50px;background:#ffffffbf;font-size:13px}.dot{width:9px;height:9px;border-radius:50%;background:#72c989;box-shadow:0 0 10px #72c989}.layout{display:grid;grid-template-columns:1fr 1.3fr;gap:22px}.panel{background:#fffaf6e6;border-radius:28px;padding:25px;box-shadow:0 20px 50px #78463d21;backdrop-filter:blur(12px)}.title{font-size:19px;font-weight:bold;margin-bottom:18px}input{width:100%;padding:16px;border:2px solid #f0c8be;border-radius:16px;background:#fffaf7;font-size:16px;color:#68463d;outline:none}input:focus{border-color:#dc9187}button{width:100%;padding:17px;margin-top:12px;border:0;border-radius:17px;background:linear-gradient(135deg,#e98d83,#d66e77);color:white;font-size:17px;font-weight:bold;cursor:pointer;box-shadow:0 10px 22px #d2646440;transition:.2s}button:hover{transform:translateY(-2px)}button:disabled{opacity:.5;cursor:not-allowed;transform:none}.secondary{background:white;color:#c96f68;border:2px solid #efc5bd;box-shadow:none}.error{margin-top:12px;color:#c45c59;font-size:14px}.ticket{margin-top:20px;padding:28px 20px;text-align:center;background:linear-gradient(135deg,#fffdfb,#fff0eb);border:2px dashed #dfa095;border-radius:24px}.ticket-label{font-size:12px;text-transform:uppercase;letter-spacing:2px;color:#aa7c72}.ticket-name{margin-top:10px;font-size:19px;font-weight:bold}.number{margin:10px 0;font-size:64px;font-weight:bold;color:#d66f68}.time{color:#a77d73;font-size:13px}.hidden{display:none}.row{display:grid;grid-template-columns:60px 1fr 100px;align-items:center;padding:12px 10px;margin-bottom:7px;background:#fff8f4;border-radius:14px}.row-number{font-weight:bold;color:#d47169}.row-name{font-weight:bold}.row-time{text-align:right;color:#a98177;font-size:12px}.empty{padding:30px;text-align:center;color:#ae8980}.count{margin-top:15px;text-align:center;font-size:13px;color:#a98177}@media(max-width:700px){.layout{grid-template-columns:1fr}h1{font-size:27px}.row{grid-template-columns:50px 1fr 75px}.number{font-size:52px}}
</style>
</head>
<body>
<div class="page">
<header>
<div class="logo">🎟️</div>
<h1>Билет к маме Сифона</h1>
<div class="subtitle">Получи свой номер и дождись своей очереди 💗</div>
<div class="status"><span class="dot"></span> Очередь работает</div>
</header>
<div class="layout">
<section class="panel">
<div class="title">💌 Получить билет</div>
<div id="form">
<input id="name" type="text" maxlength="30" placeholder="Введите ваше имя" autocomplete="name">
<button id="getButton" onclick="getTicket()">🎟️ Получить билет</button>
<div id="error" class="error"></div>
</div>
<div id="myTicket" class="hidden">
<div class="ticket" id="ticketCard">
<div class="ticket-label">Билет к маме Сифона</div>
<div class="ticket-name" id="ticketName"></div>
<div class="number" id="ticketNumber"></div>
<div class="time" id="ticketTime"></div>
</div>
<button class="secondary" onclick="downloadTicket()">📥 Скачать билет</button>
</div>
</section>
<section class="panel">
<div class="title">👥 Живая очередь</div>
<div id="queue"><div class="empty">Загружаем очередь...</div></div>
<div class="count">Всего билетов: <b id="count">0</b></div>
</section>
</div>
</div>
<script>
const SUPABASE_URL="https://amtfqxrqvtadjmqdfhrf.supabase.co";
const SUPABASE_KEY="sb_publishable_RicXtLtPzYwf3oSK_gnidw_Y10JbDwI";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser=null,myTicket=null;

async function init(){
 let {data:{session}}=await db.auth.getSession();
 if(!session){
   const {data,error}=await db.auth.signInAnonymously();
   if(error){showError("Не удалось подключиться к очереди.");console.error(error);return}
   currentUser=data.user;
 }else currentUser=session.user;
 await loadMyTicket(); await loadQueue();
 db.channel("queue-live").on("postgres_changes",{event:"*",schema:"public",table:"tickets"},()=>{loadQueue();loadMyTicket()}).subscribe();
}
async function getTicket(){
 const name=document.getElementById("name").value.trim();
 if(!name){showError("Сначала введи своё имя 💗");return}
 if(name.length<2){showError("Имя должно содержать хотя бы 2 символа.");return}
 const button=document.getElementById("getButton");button.disabled=true;button.textContent="Выдаём билет...";
 const {data,error}=await db.rpc("take_ticket",{visitor_name:name});
 if(error){
   console.error(error);
   showError(error.message.includes("already_has_ticket")?"Ты уже получил билет 💗":"Не получилось получить билет.");
   button.disabled=false;button.textContent="🎟️ Получить билет";return;
 }
 myTicket=data;
 document.getElementById("form").classList.add("hidden");
 showTicket(data);await loadQueue();
}
function showTicket(ticket){
 document.getElementById("myTicket").classList.remove("hidden");
 document.getElementById("ticketName").textContent=ticket.name;
 document.getElementById("ticketNumber").textContent="№ "+Number(ticket.ticket_number).toLocaleString("ru-RU");
 document.getElementById("ticketTime").textContent="Получен "+new Date(ticket.created_at).toLocaleString("ru-RU");
}
async function loadMyTicket(){
 if(!currentUser)return;
 const {data,error}=await db.from("tickets").select("*").eq("user_id",currentUser.id).maybeSingle();
 if(error){console.error(error);return}
 if(data){myTicket=data;document.getElementById("form").classList.add("hidden");showTicket(data)}
}
async function loadQueue(){
 const {data,error}=await db.from("tickets").select("ticket_number,name,created_at").order("ticket_number",{ascending:true});
 if(error){console.error(error);return}
 document.getElementById("count").textContent=data.length;
 const queue=document.getElementById("queue");
 if(!data.length){queue.innerHTML='<div class="empty">Пока никто не получил билет 💗</div>';return}
 queue.innerHTML=data.map(t=>`<div class="row"><div class="row-number">№${t.ticket_number}</div><div class="row-name">${escapeHtml(t.name)}</div><div class="row-time">${formatTime(t.created_at)}</div></div>`).join("");
}
function downloadTicket(){
 if(!myTicket)return;
 const canvas=document.createElement("canvas");canvas.width=1200;canvas.height=700;const ctx=canvas.getContext("2d");
 const g=ctx.createLinearGradient(0,0,1200,700);g.addColorStop(0,"#fff4e9");g.addColorStop(1,"#ffe0e5");ctx.fillStyle=g;ctx.fillRect(0,0,1200,700);
 ctx.fillStyle="#fffdfb";roundRect(ctx,100,100,1000,500,35);ctx.fill();
 ctx.strokeStyle="#dfa095";ctx.lineWidth=5;ctx.setLineDash([16,12]);roundRect(ctx,120,120,960,460,30);ctx.stroke();ctx.setLineDash([]);
 ctx.textAlign="center";ctx.fillStyle="#754c43";ctx.font="bold 44px Trebuchet MS";ctx.fillText("БИЛЕТ К МАМЕ СИФОНА 💗",600,210);
 ctx.fillStyle="#a4776d";ctx.font="bold 28px Trebuchet MS";ctx.fillText(myTicket.name,600,275);
 ctx.fillStyle="#d66f68";ctx.font="bold 110px Trebuchet MS";ctx.fillText("№ "+Number(myTicket.ticket_number).toLocaleString("ru-RU"),600,410);
 ctx.fillStyle="#a4776d";ctx.font="22px Trebuchet MS";ctx.fillText("Счастливого ожидания ✨",600,485);
 const link=document.createElement("a");link.download="bilet-k-mame-sifona.png";link.href=canvas.toDataURL("image/png");link.click();
}
function formatTime(date){return new Date(date).toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"})}
function showError(message){document.getElementById("error").textContent=message}
function escapeHtml(text){const div=document.createElement("div");div.textContent=text;return div.innerHTML}
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath()}
init();
</script>
</body>
</html>
